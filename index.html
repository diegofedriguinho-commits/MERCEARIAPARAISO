<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="tituloSistema">MERCEARIA PARAISO PDV V18.31</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 pb-24">
<div style="position:fixed;bottom:55px;right:10px;font-size:10px;color:#2563eb;opacity:0.7;font-weight:bold;z-index:9">Sistema D2 SISTEMAS</div>
<div id="userInfo" style="position:fixed;top:10px;right:10px;background:#2563eb;color:white;padding:4px 10px;border-radius:20px;font-size:12px;z-index:11;display:none"></div>
<div id="areaImpressao" style="display:none"></div>

<div id="telaLogin" style="position:fixed;inset:0;background:rgba(0,0,0,0.8);display:flex;align-items:center;justify-content:center;z-index:50">
<div style="background:white;padding:20px;border-radius:12px;width:320px;text-align:center">
<h2 id="nomeLojaLogin" style="font-size:24px;font-weight:bold;margin-bottom:10px">MERCEARIA PARAISO</h2>
<select id="usuarioLogin" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px"><option value="">Selecione</option><option value="caixa">CAIXA - 1234</option><option value="gerente">GERENTE - 9999</option></select>
<input id="senhaLogin" type="password" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px" placeholder="Senha">
<button onclick="logar()" style="width:100%;padding:10px;background:#2563eb;color:white;border-radius:8px;font-weight:bold">ENTRAR</button>
<p id="erroLogin" style="color:red;font-size:14px;margin-top:10px"></p>
<p style="font-size:10px;color:#999;margin-top:12px">Sistema por D2 SISTEMAS</p>
</div></div>

<div style="padding:8px">
<div id="venda" class="aba"><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
<div style="background:white;padding:16px;border-radius:12px"><h2 style="font-weight:bold;margin-bottom:10px">1. PRODUTOS</h2><input id="buscaProd" onkeyup="buscarProd()" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-bottom:10px" placeholder="Buscar"><div id="listaProd" style="max-height:400px;overflow-y:auto"></div></div>
<div style="background:white;padding:16px;border-radius:12px"><h2 style="font-weight:bold;margin-bottom:10px">2. CARRINHO</h2><div id="carrinho" style="max-height:200px;overflow-y:auto"></div><p>Subtotal: R$ <span id="subtotal">0.00</span></p><input id="desconto" type="number" value="0" oninput="calcularTotal()" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-top:5px" placeholder="Desconto"><p style="font-size:24px;font-weight:bold;color:green">Total: R$ <span id="total">0.00</span></p><select id="formaPag" onchange="mostrarTroco()" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-top:10px"><option value="Dinheiro">DINHEIRO</option><option value="Cartao">CARTAO</option><option value="Pix">PIX</option><option value="Prazo">PRAZO</option></select><div id="divTroco"><input id="valorRecebido" type="number" oninput="calcularTroco()" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-top:5px" placeholder="Valor Recebido"><p style="font-size:20px;font-weight:bold;color:blue">Troco: R$ <span id="troco">0.00</span></p></div><select id="clienteVenda" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;margin-top:10px"><option value="">Cliente Avulso</option></select><button onclick="finalizarVenda()" style="width:100%;padding:10px;background:green;color:white;border-radius:8px;font-weight:bold;margin-top:10px">FINALIZAR VENDA</button></div></div></div>

<div id="caixa" class="aba" style="display:none"><div style="background:white;padding:16px;border-radius:12px"><h2 style="font-weight:bold;margin-bottom:10px">CAIXA</h2><p>Saldo: R$ <span id="saldoCaixa">0.00</span></p><button onclick="iniciarFechamento()" style="width:100%;padding:10px;background:orange;color:white;border-radius:8px;font-weight:bold;margin-top:10px">FECHAR CAIXA</button><div id="divFechamento" style="display:none;margin-top:10px"><p>Deveria ter: R$ <span id="valorDeveriaTer">0.00</span></p><input id="valorContado" type="number" style="width:100%;padding:10px;border:1px solid #ccc;border-radius:8px"><button onclick="confirmarFechamento()" id="btnConfirmarFech" style="width:100%;padding:10px;background:red;color:white;border-radius:8px;font-weight:bold;margin-top:10px">CONFIRMAR</button></div></div></div>

</div>

<nav style="display:grid;grid-template-columns:repeat(5,1fr);position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd">
<button onclick="mostrarAba('venda')" id="btn-venda" style="padding:10px;font-size:12px;font-weight:bold;background:#2563eb;color:white">VENDAS</button>
<button onclick="mostrarAba('caixa')" id="btn-caixa" style="padding:10px;font-size:12px;font-weight:bold">CAIXA</button>
<button onclick="sair()" style="padding:10px;font-size:12px;font-weight:bold">SAIR</button>
</nav>

<script type="module">
const $ = id => document.getElementById(id);
const CONFIG_CLIENTE = { nome: "MERCEARIA PARAISO", projectId: "mercearia-paraiso", apiKey: "AIzaSyAXxrkC5188jhlCZTkm1RXlbPkErSzvkUg", authDomain: "mercearia-paraiso.firebaseapp.com" }

import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";

const app = initializeApp({apiKey: CONFIG_CLIENTE.apiKey, authDomain: CONFIG_CLIENTE.authDomain, projectId: CONFIG_CLIENTE.projectId});
const db = getFirestore(app);

let produtos=[], clientes=[], vendas=[], carrinho=[], subtotal=0, total=0, saldoCaixa=0, ultimoNumVenda=0, usuarioLogado=null;
const permissoes = {caixa: {senha: '1234', nome: 'CAIXA', podeFecharCaixa: false}, gerente: {senha: '9999', nome: 'GERENTE', podeFecharCaixa: true}}

window.mostrarAba = function(id){
  document.querySelectorAll('.aba').forEach(a=>a.style.display='none');
  $(id).style.display='block';
}

window.logar = function(){
  let user = $('usuarioLogin').value;
  let senha = $('senhaLogin').value;
  if(permissoes[user] && permissoes[user].senha == senha){
    localStorage.setItem('usuarioLogado', user);
    usuarioLogado = user;
    $('telaLogin').style.display = 'none';
    $('userInfo').style.display = 'block';
    $('userInfo').innerText = permissoes[usuarioLogado].nome;
    carregarTudo();
  } else {
    $('erroLogin').innerText = 'Usuário ou Senha inválidos!';
  }
}

window.sair = function(){
  localStorage.removeItem('usuarioLogado');
  location.reload();
}

function carregarTudo(){
  onSnapshot(collection(db,"produtos"),snap=>{produtos=snap.docs.map(d=>({id:d.id,...d.data()})); buscarProd();});
  onSnapshot(collection(db,"clientes"),snap=>{clientes=snap.docs.map(d=>({id:d.id,...d.data()})); $('clienteVenda').innerHTML='<option value="">Cliente Avulso</option>'+clientes.map(c=>'<option value="'+c.id+'">'+c.nome+'</option>').join('')});
  onSnapshot(query(collection(db,"vendas"), orderBy("numVenda","desc"), limit(1)),snap=>{if(!snap.empty){ultimoNumVenda=snap.docs[0].data().numVenda||0}});
  onSnapshot(collection(db,"caixa"),snap=>{let mov=snap.docs.map(d=>d.data()); saldoCaixa=mov.reduce((a,d)=>a+(d.valor||0),0); $('saldoCaixa').innerText=saldoCaixa.toFixed(2);});
}

window.buscarProd = function(){
  let termo = $('buscaProd').value.toLowerCase();
  $('listaProd').innerHTML = produtos.filter(p=>p.nome.toLowerCase().includes(termo)).map(p=>'<div onclick="addCarrinho(\''+p.id+'\')" style="padding:8px;border-bottom:1px solid #eee;cursor:pointer">'+p.nome+' - R$'+Number(p.preco||0).toFixed(2)+'</div>').join('');
}

window.addCarrinho = function(id){
  let p = produtos.find(x=>x.id==id);
  let item = carrinho.find(i=>i.id==id);
  if(item){item.qtd++; item.total=item.qtd*p.preco} else {carrinho.push({id:p.id,nome:p.nome,preco:p.preco,qtd:1,total:p.preco})}
  atualizarCarrinho();
}

window.atualizarCarrinho = function(){
  $('carrinho').innerHTML = carrinho.map(i=>'<div>'+i.nome+' x'+i.qtd+' R$'+i.total.toFixed(2)+'</div>').join('');
  subtotal = carrinho.reduce((a,i)=>a+i.total,0);
  $('subtotal').innerText = subtotal.toFixed(2);
  calcularTotal();
}

window.calcularTotal = function(){
  let desc = parseFloat($('desconto').value)||0;
  total = subtotal - desc;
  $('total').innerText = total.toFixed(2);
  calcularTroco();
}

window.mostrarTroco = function(){
  if($('formaPag').value=='Dinheiro'){$('divTroco').style.display='block'} else {$('divTroco').style.display='none'}
}

window.calcularTroco = function(){
  let recebido = parseFloat($('valorRecebido').value)||0;
  $('troco').innerText = (recebido-total).toFixed(2);
}

window.finalizarVenda = async function(){
  if(carrinho.length==0) return alert("Carrinho vazio");
  let numVenda = ultimoNumVenda + 1;
  await addDoc(collection(db,"vendas"),{numVenda, itens:carrinho, total, forma:$('formaPag').value, data:serverTimestamp()});
  if($('formaPag').value!='Prazo'){await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:total,data:serverTimestamp()})}
  carrinho=[]; subtotal=0; total=0; $('desconto').value=0; atualizarCarrinho(); alert("Venda finalizada!");
}

window.iniciarFechamento = function(){
  $('valorDeveriaTer').innerText = saldoCaixa.toFixed(2);
  $('divFechamento').style.display = 'block';
}

window.confirmarFechamento = async function(){
  if(saldoCaixa > 0) await addDoc(collection(db,"caixa"),{tipo:'retirada_fechamento',valor:-saldoCaixa,data:serverTimestamp()});
  $('divFechamento').style.display = 'none';
  alert("Caixa Fechado!");
}

// Carrega login salvo
let userSalvo = localStorage.getItem('usuarioLogado');
if(userSalvo && permissoes[userSalvo]){
  usuarioLogado = userSalvo;
  $('telaLogin').style.display = 'none';
  $('userInfo').style.display = 'block';
  $('userInfo').innerText = permissoes[usuarioLogado].nome;
  carregarTudo();
}
</script>
</body>
</html>
