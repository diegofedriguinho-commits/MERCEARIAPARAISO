<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MERCEARIA PARAISO PDV V18.42.2</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#f1f5f9;font-family:'Segoe UI',sans-serif;padding-bottom:90px}.btn{padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer}.input{padding:10px;border:1px solid #ccc;border-radius:8px;width:100%}.card{background:white;padding:16px;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}.aba{display:none}.ativa{display:block}.menu{display:flex;justify-content:space-around;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;z-index:10}.menu button{padding:8px 2px;font-size:10px;font-weight:bold;flex:1}.menu button.on{background:#2563eb;color:white}.marca-dagua{position:fixed;bottom:55px;right:10px;font-size:10px;color:#2563eb;opacity:.7;font-weight:bold}.barra-limite{height:8px;border-radius:4px;background:#e5e7eb;overflow:hidden}.barra-fill{height:100%}.venc-atrasado{background:#fee2e2;border-left:4px solid #ef4444}.venc-hoje{background:#fef9c3;border-left:4px solid #eab308}.venc-futuro{background:#dcfce7;border-left:4px solid #22c55e}</style>
</head>
<body>
<div class="marca-dagua">D2 SYSTEMAS</div>
<div id="telaLogin" style="position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:50"><div class="card w-80 text-center"><h2 class="text-2xl font-bold">MERCEARIA PARAISO</h2><select id="usuarioLogin" class="input mb-2 mt-2"><option value="">Selecione</option><option value="caixa">CAIXA</option><option value="gerente">GERENTE</option></select><input id="senhaLogin" type="password" class="input mb-2" placeholder="Senha"><button onclick="logar()" class="w-full btn bg-blue-600 text-white">ENTRAR</button><p id="erroLogin" class="text-red-500 text-sm"></p></div></div>

<div class="p-2 pb-24">
<!-- VENDA -->
<div id="venda" class="aba ativa"><div class="grid lg:grid-cols-2 gap-2"><div class="card"><h2 class="font-bold">PRODUTOS</h2><input id="buscaProd" onkeyup="buscarProd()" class="input mb-2" placeholder="Buscar + ENTER"><div id="listaProd" style="max-height:350px;overflow:auto"></div></div><div class="card"><h2 class="font-bold">CARRINHO</h2><div id="carrinho"></div><p>Subtotal: R$ <span id="subtotal">0.00</span></p><input id="desconto" type="number" value="0" oninput="calcularTotal()" class="input" placeholder="Desconto"><p class="text-2xl font-bold text-green-600">Total: R$ <span id="total">0.00</span></p><select id="formaPag" class="input mt-2"><option value="Dinheiro">DINHEIRO</option><option value="Cartao">CARTAO</option><option value="Pix">PIX</option><option value="Prazo">PRAZO/FIADO</option></select><select id="clienteVenda" class="input mt-2" onchange="mostrarInfoClienteVenda()"><option value="">Avulso</option></select><div id="infoLimiteVenda" class="mt-2 p-2 bg-yellow-50 rounded text-xs" style="display:none"></div><button onclick="finalizarVenda()" class="w-full btn bg-green-600 text-white mt-2">FINALIZAR</button></div></div></div>

<!-- CLIENTES (COMPLETO JA FEITO) -->
<div id="clientes" class="aba"><div class="card mb-2"><h2 class="font-bold">CLIENTE COMPLETO + LIMITE</h2><input type="hidden" id="cId"><div class="grid md:grid-cols-3 gap-2"><input id="cNome" class="input" placeholder="Nome*"><input id="cCpf" class="input" placeholder="CPF/CNPJ"><input id="cRg" class="input" placeholder="RG"><input id="cTel" class="input" placeholder="Telefone"><input id="cNasc" type="date" class="input"><input id="cLimite" type="number" step="0.01" class="input bg-yellow-50 font-bold" placeholder="Limite R$"><input id="cEndereco" class="input md:col-span-2" placeholder="Endereco"><input id="cBairro" class="input" placeholder="Bairro"><input id="cCidade" class="input" placeholder="Cidade"><input id="cCep" class="input" placeholder="CEP"><input id="cObs" class="input md:col-span-3" placeholder="Obs"></div><button onclick="salvarCliente()" class="w-full btn bg-blue-600 text-white mt-2">SALVAR CLIENTE</button></div><div id="listaClientes" class="grid md:grid-cols-2 gap-2"></div></div>

<!-- FORNECEDORES COMPLETO -->
<div id="fornecedores" class="aba"><div class="card mb-2"><h2 class="font-bold">FORNECEDOR COMPLETO</h2><input type="hidden" id="fId"><div class="grid md:grid-cols-3 gap-2">
<input id="fRazao" class="input" placeholder="Razão Social *"><input id="fFantasia" class="input" placeholder="Nome Fantasia"><input id="fCnpj" class="input" placeholder="CNPJ/CPF">
<input id="fIe" class="input" placeholder="Inscrição Estadual"><input id="fTel" class="input" placeholder="Telefone"><input id="fWhatsapp" class="input" placeholder="WhatsApp">
<input id="fEmail" class="input" placeholder="Email"><input id="fContato" class="input" placeholder="Nome do Vendedor/Contato"><input id="fCondPag" class="input" placeholder="Condição Pagto (ex: 30/60 dias)">
<input id="fEndereco" class="input md:col-span-2" placeholder="Endereço"><input id="fBairro" class="input" placeholder="Bairro"><input id="fCidade" class="input" placeholder="Cidade"><input id="fCep" class="input" placeholder="CEP"><input id="fObs" class="input md:col-span-3" placeholder="Observações">
</div><button onclick="salvarFornecedor()" class="w-full btn bg-blue-600 text-white mt-2">SALVAR FORNECEDOR</button></div><div id="listaFornecedores" class="grid md:grid-cols-2 gap-2"></div></div>

<!-- CONTAS A PAGAR COM VENCIMENTO -->
<div id="pagar" class="aba"><div class="card mb-2"><h2 class="font-bold">CONTAS A PAGAR - COM VENCIMENTO</h2>
<div class="grid md:grid-cols-3 gap-2">
<input id="pgDesc" class="input" placeholder="Descrição / Nº Nota">
<input id="pgValor" type="number" step="0.01" class="input" placeholder="Valor Total R$">
<input id="pgParcelas" type="number" value="1" class="input" placeholder="Qtd Parcelas">
<select id="pgFornecedor" class="input"><option value="">Fornecedor</option></select>
<input id="pgVenc1" type="date" class="input font-bold bg-yellow-50" placeholder="Vencimento 1ª Parcela">
<input id="pgBoleto" class="input" placeholder="Nº Boleto/Doc (opcional)">
</div>
<button onclick="salvarContaPagar()" class="w-full btn bg-red-600 text-white mt-2">GERAR PARCELAS COM VENCIMENTOS</button>
<p class="text-xs text-gray-500 mt-1">* Informe a data da 1ª parcela, as demais vencem a cada 30 dias automaticamente</p>
<hr class="my-2">
<div class="flex gap-2"><button onclick="filtroPagar='todos'; listarPagar()" class="btn bg-gray-600 text-white text-xs">TODAS</button><button onclick="filtroPagar='atrasadas'; listarPagar()" class="btn bg-red-600 text-white text-xs">ATRASADAS</button><button onclick="filtroPagar='hoje'; listarPagar()" class="btn bg-yellow-500 text-white text-xs">VENCEM HOJE</button><button onclick="filtroPagar='aberto'; listarPagar()" class="btn bg-blue-600 text-white text-xs">EM ABERTO</button></div>
</div><div id="listaPagar" class="grid gap-2"></div><div id="resumoPagar" class="card mt-2 bg-gray-50"></div></div>

<!-- DEMAIS ABAS -->
<div id="produtos" class="aba"><div class="card"><h2 class="font-bold">PRODUTO</h2><input type="hidden" id="pId"><div class="grid md:grid-cols-4 gap-2"><input id="pNome" class="input" placeholder="Nome"><input id="pCod" class="input" placeholder="Cod"><input id="pCusto" type="number" step="0.01" class="input" placeholder="Custo"><input id="pPreco" type="number" step="0.01" class="input" placeholder="Preço"><input id="pEstoque" type="number" class="input" placeholder="Estoque"><select id="pFornecedor" class="input"><option value="">Fornecedor</option></select></div><button onclick="salvarProduto()" class="w-full btn bg-blue-600 text-white mt-2">SALVAR</button></div><div id="listaProdutos" class="grid md:grid-cols-2 gap-2 mt-2"></div></div>
<div id="receber" class="aba"><div id="listaReceber"></div></div>
<div id="loja" class="aba"><div class="card"><input type="hidden" id="lId"><input id="lNome" class="input mb-2" value="MERCEARIA PARAISO"><input id="lEnd" class="input mb-2" placeholder="Endereco"><input id="lTel" class="input mb-2" placeholder="Tel"><button onclick="salvarLoja()" class="btn bg-blue-600 text-white">SALVAR</button></div></div>
<div id="caixa" class="aba"><div class="card"><p>Saldo Caixa: R$ <span id="saldoCaixa">0.00</span></p><p>Saldo Mes: R$ <span id="saldoMes">0.00</span></p><input id="mValor" type="number" class="input mt-2" placeholder="Valor"><input id="mDesc" class="input mt-1" placeholder="Desc"><button onclick="entradaCaixa()" class="btn bg-green-600 text-white">ENTRADA</button><button onclick="saidaCaixa()" class="btn bg-red-600 text-white">SAIDA</button><hr class="my-2"><select id="recCliente" onchange="carregarDividas()" class="input"><option value="">Cliente</option></select><div id="divDividas"></div></div></div>
</div>
<nav class="menu"><button onclick="mostrarAba('venda')" id="btn-venda" class="on">VENDA</button><button onclick="mostrarAba('produtos')" id="btn-produtos">PROD</button><button onclick="mostrarAba('clientes')" id="btn-clientes">CLIENTE</button><button onclick="mostrarAba('fornecedores')" id="btn-fornecedores">FORNEC</button><button onclick="mostrarAba('pagar')" id="btn-pagar">PAGAR</button><button onclick="mostrarAba('receber')" id="btn-receber">RECEBER</button><button onclick="mostrarAba('caixa')" id="btn-caixa">CAIXA</button><button onclick="mostrarAba('loja')" id="btn-loja">LOJA</button><button onclick="sair()">SAIR</button></nav>

<script type="module">
const $ = id => document.getElementById(id);
const SENHA_FIREBASE = "LOLA2025";
const CONFIG_CLIENTE = { nome: "MERCEARIA PARAISO", projectId: "mercearia-paraiso", apiKey: "AIzaSyAXxrkC5188jhlCZTkm1RXlbPkErSzvkUg", authDomain: "mercearia-paraiso.firebaseapp.com" }
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, serverTimestamp, getDocs, setDoc, writeBatch, query, limit, orderBy } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";
const app = initializeApp({apiKey: CONFIG_CLIENTE.apiKey, authDomain: CONFIG_CLIENTE.authDomain, projectId: CONFIG_CLIENTE.projectId});const db = getFirestore(app);
let produtos=[], clientes=[], fornecedores=[], vendas=[], receber=[], pagar=[], movCaixa=[], loja={}, carrinho=[], subtotal=0, total=0, saldoCaixa=0, ultimoNumVenda=0, filtroPagar='aberto';
let permissoes={caixa:{senha:'3112'},gerente:{senha:'9755'}};
window.mostrarAba=id=>{document.querySelectorAll('.aba').forEach(a=>a.classList.remove('ativa'));$(id).classList.add('ativa');document.querySelectorAll('.menu button').forEach(b=>b.classList.remove('on'));$(`btn-${id}`)?.classList.add('on');}
window.logar=()=>{let u=$('usuarioLogin').value,s=$('senhaLogin').value;if(permissoes[u]&&permissoes[u].senha==s){$('telaLogin').style.display='none';carregarTudo();}else{$('erroLogin').innerText='Senha inválida';}}
window.sair=()=>location.reload();
function carregarTudo(){
 onSnapshot(collection(db,"produtos"),s=>{produtos=s.docs.map(d=>({id:d.id,...d.data()})); buscarProd(); listarProdutos(); carregarFornecedoresSelect();});
 onSnapshot(collection(db,"clientes"),s=>{clientes=s.docs.map(d=>({id:d.id,...d.data()})); listarClientes(); carregarClientesSelect(); carregarClientesRecebimento();});
 onSnapshot(collection(db,"fornecedores"),s=>{fornecedores=s.docs.map(d=>({id:d.id,...d.data()})); listarFornecedores(); carregarFornecedoresSelect();});
 onSnapshot(collection(db,"pagar"),s=>{pagar=s.docs.map(d=>({id:d.id,...d.data()})); listarPagar();});
 onSnapshot(collection(db,"receber"),s=>{receber=s.docs.map(d=>({id:d.id,...d.data()})); listarReceber();});
 onSnapshot(collection(db,"caixa"),s=>{movCaixa=s.docs.map(d=>({id:d.id,...d.data()})); let ent=movCaixa.filter(m=>m.tipo=='entrada').reduce((a,b)=>a+(b.valor||0),0); let sai=movCaixa.filter(m=>m.tipo=='saida').reduce((a,b)=>a+(b.valor||0),0); saldoCaixa=ent+sai; $('saldoCaixa').innerText=saldoCaixa.toFixed(2); $('saldoMes').innerText=saldoCaixa.toFixed(2);});
 onSnapshot(query(collection(db,"vendas"), orderBy("numVenda","desc"), limit(1)),s=>{if(!s.empty) ultimoNumVenda=s.docs[0].data().numVenda||0});
}
window.buscarProd=()=>{ $('listaProd').innerHTML=produtos.filter(p=>p.nome.toLowerCase().includes($('buscaProd').value.toLowerCase())).map(p=>`<div onclick="addCarrinho('${p.id}')" style="padding:8px;border-bottom:1px solid #eee;cursor:pointer">${p.nome} - R$${Number(p.preco||0).toFixed(2)} [${p.estoque||0}]</div>`).join('');}
window.listarProdutos=()=>{$('listaProdutos').innerHTML=produtos.map(p=>`<div class="card"><b>${p.nome}</b><br>R$${p.preco}<button onclick="excluirProduto('${p.id}')" class="btn bg-red-500 text-white text-xs ml-2">X</button></div>`).join('');}
window.salvarProduto=async()=>{let f=fornecedores.find(x=>x.id==$('pFornecedor').value);let d={nome:$('pNome').value,cod:$('pCod').value,custo:parseFloat($('pCusto').value)||0,preco:parseFloat($('pPreco').value)||0,estoque:parseInt($('pEstoque').value)||0,fornecedorId:$('pFornecedor').value,fornecedorNome:f?f.fantasia||f.razao:'',senhaSistema:SENHA_FIREBASE};if($('pId').value)await updateDoc(doc(db,"produtos",$('pId').value),d);else await addDoc(collection(db,"produtos"),d); alert("Salvo");}
window.excluirProduto=async id=>{if(confirm("Excluir?")) await deleteDoc(doc(db,"produtos",id));}
window.addCarrinho=id=>{let p=produtos.find(x=>x.id==id);let item=carrinho.find(i=>i.id==id);if(item)item.qtd++;else carrinho.push({id:p.id,nome:p.nome,preco:p.preco,qtd:1,total:p.preco}); atualizarCarrinho();}
window.atualizarCarrinho=()=>{$('carrinho').innerHTML=carrinho.map(i=>`${i.nome} x${i.qtd} R$${(i.qtd*i.preco).toFixed(2)}`).join('<br>');subtotal=carrinho.reduce((a,i)=>a+(i.qtd*i.preco),0);$('subtotal').innerText=subtotal.toFixed(2);calcularTotal();}
window.calcularTotal=()=>{let desc=parseFloat($('desconto').value)||0;total=subtotal-desc;$('total').innerText=total.toFixed(2);}
window.mostrarInfoClienteVenda=()=>{let id=$('clienteVenda').value;if(!id){$('infoLimiteVenda').style.display='none';return;}let c=clientes.find(x=>x.id==id);let dev=receber.filter(r=>r.clienteId==id).reduce((a,b)=>a+(b.saldo||0),0);let lim=c.limiteCredito||0;let disp=lim>0?lim-dev:0;$('infoLimiteVenda').innerHTML=`<b>${c.nome}</b><br>Limite: R$${lim>0?lim.toFixed(2):'∞'} | Devendo: R$${dev.toFixed(2)} | Disp: R$${lim>0?disp.toFixed(2):'∞'}`;$('infoLimiteVenda').style.display='block';}
window.finalizarVenda=async()=>{if(carrinho.length==0)return alert("Carrinho vazio");let forma=$('formaPag').value,cliId=$('clienteVenda').value,cli=clientes.find(c=>c.id==cliId);if(forma=='Prazo'&&!cliId)return alert("Selecione cliente");if(forma=='Prazo'&&cli){let dev=receber.filter(r=>r.clienteId==cliId).reduce((a,b)=>a+(b.saldo||0),0);let lim=cli.limiteCredito||0;if(lim>0&&total>(lim-dev))return alert(`LIMITE ESTOURADO! Disponível: R$${(lim-dev).toFixed(2)}`);}let num=ultimoNumVenda+1;let v={numVenda:num,itens:carrinho,subtotal,desconto:parseFloat($('desconto').value)||0,total,forma,clienteId:cliId,clienteNome:cli?cli.nome:'Avulso',data:serverTimestamp(),senhaSistema:SENHA_FIREBASE};let ref=await addDoc(collection(db,"vendas"),v);for(let i of carrinho){let p=produtos.find(x=>x.id==i.id);await updateDoc(doc(db,"produtos",i.id),{estoque:(p.estoque||0)-i.qtd,senhaSistema:SENHA_FIREBASE});}if(forma!='Prazo')await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:total,desc:'Venda '+forma,data:serverTimestamp(),senhaSistema:SENHA_FIREBASE});else await addDoc(collection(db,"receber"),{clienteId:cliId,cliente:cli.nome,valorTotal:total,valorPago:0,saldo:total,numVenda:num,data:serverTimestamp(),senhaSistema:SENHA_FIREBASE});carrinho=[];atualizarCarrinho();alert("Venda OK!");}

// CLIENTES
window.listarClientes=()=>{$('listaClientes').innerHTML=clientes.map(c=>{let dev=receber.filter(r=>r.clienteId==c.id).reduce((a,b)=>a+(b.saldo||0),0);let lim=c.limiteCredito||0;return `<div class="card"><b>${c.nome}</b><br>${c.cpf||''} ${c.tel||''}<br>Limite: R$${lim} Dev: R$${dev.toFixed(2)}<br><button onclick="editarCliente('${c.id}')" class="btn bg-yellow-500 text-white text-xs">EDITAR</button> <button onclick="excluirCliente('${c.id}')" class="btn bg-red-500 text-white text-xs">EXCLUIR</button></div>`}).join('');}
window.salvarCliente=async()=>{let d={nome:$('cNome').value,cpf:$('cCpf').value,rg:$('cRg').value,tel:$('cTel').value,nascimento:$('cNasc').value,endereco:$('cEndereco').value,bairro:$('cBairro').value,cidade:$('cCidade').value,cep:$('cCep').value,obs:$('cObs').value,limiteCredito:parseFloat($('cLimite').value)||0,senhaSistema:SENHA_FIREBASE};if($('cId').value)await updateDoc(doc(db,"clientes",$('cId').value),d);else await addDoc(collection(db,"clientes"),d);limparCliente();alert("Cliente salvo");}
window.editarCliente=id=>{let c=clientes.find(x=>x.id==id);$('cId').value=c.id;$('cNome').value=c.nome;$('cCpf').value=c.cpf||'';$('cRg').value=c.rg||'';$('cTel').value=c.tel||'';$('cNasc').value=c.nascimento||'';$('cEndereco').value=c.endereco||'';$('cBairro').value=c.bairro||'';$('cCidade').value=c.cidade||'';$('cCep').value=c.cep||'';$('cObs').value=c.obs||'';$('cLimite').value=c.limiteCredito||0;mostrarAba('clientes');}
window.excluirCliente=async id=>{if(confirm("Excluir?"))await deleteDoc(doc(db,"clientes",id));}
window.limparCliente=()=>{$('cId').value='';['cNome','cCpf','cRg','cTel','cNasc','cEndereco','cBairro','cCidade','cCep','cObs','cLimite'].forEach(i=>$(i).value='');}
window.carregarClientesSelect=()=>{$('clienteVenda').innerHTML='<option value="">Avulso</option>'+clientes.map(c=>`<option value="${c.id}">${c.nome} (Lim R$${c.limiteCredito||0})</option>`).join('');}
window.carregarClientesRecebimento=()=>{$('recCliente').innerHTML='<option value="">Selecione</option>'+clientes.map(c=>`<option value="${c.id}">${c.nome}</option>`).join('');}
window.carregarDividas=()=>{let id=$('recCliente').value;let divs=receber.filter(r=>r.clienteId==id&&r.saldo>0);$('divDividas').innerHTML=divs.map(d=>`<div class="card mt-1"><b>Venda ${d.numVenda}</b> Saldo R$${d.saldo.toFixed(2)}<input id="pag${d.id}" type="number" class="input mt-1" placeholder="Valor"><button onclick="receberParcial('${d.id}')" class="btn bg-green-600 text-white w-full mt-1">RECEBER</button></div>`).join('');}
window.receberParcial=async id=>{let v=parseFloat($('pag'+id).value);if(!v)return alert("Valor");let c=receber.find(r=>r.id==id);let novo=c.saldo-v;await updateDoc(doc(db,"receber",id),{valorPago:(c.valorPago||0)+v,saldo:novo,senhaSistema:SENHA_FIREBASE});await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:v,desc:'Receb '+c.cliente,data:serverTimestamp(),senhaSistema:SENHA_FIREBASE});alert("Recebido");}

// FORNECEDORES COMPLETO
window.listarFornecedores=()=>{$('listaFornecedores').innerHTML=fornecedores.map(f=>`<div class="card"><b>${f.fantasia||f.razao}</b><br>${f.cnpj||''} - ${f.razao||''}<br>${f.tel||''} ${f.cidade||''}<br><span class="text-xs">${f.condPag||''}</span><br><button onclick="editarFornecedor('${f.id}')" class="btn bg-yellow-500 text-white text-xs mt-1">EDITAR</button> <button onclick="excluirFornecedor('${f.id}')" class="btn bg-red-500 text-white text-xs">EXCLUIR</button></div>`).join('');}
window.salvarFornecedor=async()=>{if(!$('fRazao').value)return alert("Razão obrigatória");let d={razao:$('fRazao').value,fantasia:$('fFantasia').value,cnpj:$('fCnpj').value,ie:$('fIe').value,tel:$('fTel').value,whatsapp:$('fWhatsapp').value,email:$('fEmail').value,contato:$('fContato').value,condPag:$('fCondPag').value,endereco:$('fEndereco').value,bairro:$('fBairro').value,cidade:$('fCidade').value,cep:$('fCep').value,obs:$('fObs').value,senhaSistema:SENHA_FIREBASE};if($('fId').value)await updateDoc(doc(db,"fornecedores",$('fId').value),d);else await addDoc(collection(db,"fornecedores"),d);limparFornecedor();alert("Fornecedor salvo!");}
window.editarFornecedor=id=>{let f=fornecedores.find(x=>x.id==id);$('fId').value=f.id;$('fRazao').value=f.razao||'';$('fFantasia').value=f.fantasia||'';$('fCnpj').value=f.cnpj||'';$('fIe').value=f.ie||'';$('fTel').value=f.tel||'';$('fWhatsapp').value=f.whatsapp||'';$('fEmail').value=f.email||'';$('fContato').value=f.contato||'';$('fCondPag').value=f.condPag||'';$('fEndereco').value=f.endereco||'';$('fBairro').value=f.bairro||'';$('fCidade').value=f.cidade||'';$('fCep').value=f.cep||'';$('fObs').value=f.obs||'';mostrarAba('fornecedores');}
window.excluirFornecedor=async id=>{if(confirm("Excluir fornecedor?"))await deleteDoc(doc(db,"fornecedores",id));}
window.limparFornecedor=()=>{$('fId').value='';['fRazao','fFantasia','fCnpj','fIe','fTel','fWhatsapp','fEmail','fContato','fCondPag','fEndereco','fBairro','fCidade','fCep','fObs'].forEach(i=>$(i).value='');}
window.carregarFornecedoresSelect=()=>{let opt='<option value="">Fornecedor</option>'+fornecedores.map(f=>`<option value="${f.id}">${f.fantasia||f.razao}</option>`).join('');$('pFornecedor').innerHTML=opt;$('pgFornecedor').innerHTML=opt;}

// CONTAS A PAGAR COM VENCIMENTO
window.salvarContaPagar=async()=>{
 if(!$('pgDesc').value||!$('pgValor').value||!$('pgVenc1').value)return alert("Descrição, Valor e Vencimento da 1ª parcela são obrigatórios");
 let total=parseFloat($('pgValor').value);let parc=parseInt($('pgParcelas').value)||1;let valorParc=total/parc;let forn=fornecedores.find(f=>f.id==$('pgFornecedor').value);
 let venc1=new Date($('pgVenc1').value+"T12:00:00");
 const batch=writeBatch(db);
 for(let i=1;i<=parc;i++){
  let venc=new Date(venc1); venc.setMonth(venc.getMonth()+i-1);
  let ref=doc(collection(db,"pagar"));
  batch.set(ref,{
   desc:$('pgDesc').value+' - Parc '+i+'/'+parc,
   descOriginal:$('pgDesc').value,
   valor:valorParc,
   valorTotal:total,
   parcela:i,
   totalParcelas:parc,
   boleto:$('pgBoleto').value?$('pgBoleto').value+'-'+i+'/'+parc:$('pgDesc').value+'-'+i,
   fornecedorId:$('pgFornecedor').value,
   fornecedorNome:forn?forn.fantasia||forn.razao:'---',
   vencimento:venc,
   vencimentoStr:venc.toISOString().split('T')[0],
   pago:false,
   dataCriacao:serverTimestamp(),
   senhaSistema:SENHA_FIREBASE
  });
 }
 await batch.commit();
 $('pgDesc').value='';$('pgValor').value='';$('pgParcelas').value='1';$('pgBoleto').value='';$('pgVenc1').value='';
 alert(parc+' parcelas geradas com vencimentos!');
}
window.listarPagar=()=>{
 let hoje=new Date();hoje.setHours(0,0,0,0);
 let hojeStr=hoje.toISOString().split('T')[0];
 let lista=[...pagar];
 if(filtroPagar=='aberto') lista=lista.filter(p=>!p.pago);
 if(filtroPagar=='atrasadas') lista=lista.filter(p=>!p.pago && p.vencimento && new Date(p.vencimentoStr+"T12:00:00")<hoje);
 if(filtroPagar=='hoje') lista=lista.filter(p=>!p.pago && p.vencimentoStr==hojeStr);
 lista.sort((a,b)=> new Date(a.vencimentoStr) - new Date(b.vencimentoStr));
 let totalAberto=lista.filter(p=>!p.pago).reduce((a,b)=>a+b.valor,0);
 let totalAtrasado=pagar.filter(p=>!p.pago && p.vencimento && new Date(p.vencimentoStr+"T12:00:00")<hoje).reduce((a,b)=>a+b.valor,0);
 $('listaPagar').innerHTML=lista.map(p=>{
  let vencDate=p.vencimento?new Date(p.vencimentoStr+"T12:00:00"):null;
  let classe='venc-futuro'; let status='A VENCER';
  if(p.pago){classe='bg-gray-100'; status='PAGO';}
  else if(vencDate){
   if(vencDate<hoje){classe='venc-atrasado'; status='ATRASADO';}
   else if(p.vencimentoStr==hojeStr){classe='venc-hoje'; status='VENCE HOJE';}
  }
  return `<div class="card ${classe}"><div class="flex justify-between"><b>${p.desc}</b><span class="text-xs font-bold">${status}</span></div>
  <span class="text-xs">Forn: ${p.fornecedorNome||'---'} | Boleto: ${p.boleto||'---'}</span><br>
  <span class="text-xs">Venc: <b>${p.vencimentoStr? p.vencimentoStr.split('-').reverse().join('/'):'---'}</b> | Parc ${p.parcela||1}/${p.totalParcelas||1}</span><br>
  <span class="font-bold text-lg">R$${Number(p.valor||0).toFixed(2)}</span>
  ${!p.pago?`<button onclick="pagarParcela('${p.id}')" class="btn bg-red-600 text-white w-full mt-2">PAGAR ESTA PARCELA</button>`: `<span class="text-green-600 font-bold text-xs">✓ Pago em ${p.dataPagamento? new Date(p.dataPagamento.seconds*1000).toLocaleDateString() : ''}</span>`}
  </div>`;
 }).join('') || '<p class="p-4 text-center text-gray-500">Nenhuma conta nesse filtro</p>';
 $('resumoPagar').innerHTML=`<p class="text-sm"><b>RESUMO:</b> Total em aberto: <b class="text-red-600">R$${totalAberto.toFixed(2)}</b> | Atrasado: <b class="text-red-800">R$${totalAtrasado.toFixed(2)}</b> | Qtd: ${lista.filter(p=>!p.pago).length} parcelas</p>`;
}
window.pagarParcela=async id=>{
 let conta=pagar.find(p=>p.id==id);
 if(!confirm(`Pagar R$${conta.valor.toFixed(2)} - ${conta.desc} - Venc ${conta.vencimentoStr}?`)) return;
 await updateDoc(doc(db,"pagar",id),{pago:true,dataPagamento:serverTimestamp(),senhaSistema:SENHA_FIREBASE});
 await addDoc(collection(db,"caixa"),{tipo:'saida',valor:-conta.valor,desc:'Pag '+conta.desc+' Boleto '+conta.boleto,data:serverTimestamp(),senhaSistema:SENHA_FIREBASE});
 alert("Conta paga!");
}
window.listarReceber=()=>{$('listaReceber').innerHTML=receber.filter(r=>r.saldo>0).map(r=>`<div class="card"><b>${r.cliente}</b> Venda ${r.numVenda} Saldo R$${r.saldo.toFixed(2)}</div>`).join('');}
window.salvarLoja=async()=>{let d={nome:$('lNome').value,end:$('lEnd').value,tel:$('lTel').value,senhaSistema:SENHA_FIREBASE};if($('lId').value)await setDoc(doc(db,"loja",$('lId').value),d);else await addDoc(collection(db,"loja"),d);alert("Salvo");}
window.entradaCaixa=async()=>{if(!$('mValor').value)return alert("Valor");await addDoc(collection(db,"caixa"),{tipo:'entrada',valor:parseFloat($('mValor').value),desc:$('mDesc').value,data:serverTimestamp(),senhaSistema:SENHA_FIREBASE});}
window.saidaCaixa=async()=>{if(!$('mValor').value)return alert("Valor");await addDoc(collection(db,"caixa"),{tipo:'saida',valor:-parseFloat($('mValor').value),desc:$('mDesc').value,data:serverTimestamp(),senhaSistema:SENHA_FIREBASE});}
</script>
